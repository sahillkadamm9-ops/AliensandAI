/* Layout: full-bleed 3D arena viewed from above; HUD bar on top (runner left, clock centre, saboteur right); dialogs centred over a blurred scene. */
:root {
  --ink: #080c1c;
  --panel: rgba(10, 14, 34, 0.82);
  --panel-solid: #0e1330;
  --line: rgba(160, 180, 255, 0.22);
  --text: #eaf0ff;
  --dim: #97a3cf;
  --runner: #2de2c4;
  --sab: #ff4585;
  --amber: #8eff55;
  --violet: #b07cff;
  --font-display: 'Bungee', Impact, 'Arial Black', sans-serif;
  --font-body: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'Share Tech Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 500;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
#stage { position: relative; width: 100%; height: 100%; overflow: hidden; outline: none; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* HUD */
.hud {
  position: absolute; inset: 0; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 10px 14px; min-width: 240px; flex: 0 1 300px; backdrop-filter: blur(6px);
}
.card header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.pid { font-family: var(--font-mono); font-size: 13px; padding: 1px 7px; border-radius: 3px; color: var(--ink); }
.runner .pid { background: var(--runner); }
.sab .pid { background: var(--sab); }
.role { font-family: var(--font-display); font-size: 15px; letter-spacing: 0.04em; }
.runner .role { color: var(--runner); }
.sab .role { color: var(--sab); }
.pts { margin-left: auto; font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.lab { width: 68px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
.pips { display: inline-flex; gap: 5px; }
.pips i { width: 20px; height: 10px; border: 1px solid var(--line); border-radius: 2px; background: transparent; }
.runner .pips.hp i.on { background: var(--runner); border-color: var(--runner); box-shadow: 0 0 8px var(--runner); }
.runner .pips.cores i.on { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 8px var(--amber); }
.meter { flex: 1; height: 10px; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 100%; background: var(--sab); transform-origin: left; }
.traps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.trap { position: relative; border: 1px solid var(--line); border-radius: 4px; padding: 5px 6px 6px; overflow: hidden; min-width: 0; }
.trap kbd { font-family: var(--font-mono); font-size: 13px; background: var(--text); color: var(--ink); border-radius: 3px; padding: 0 6px; }
.trap b { display: block; font-size: 14px; margin-top: 3px; line-height: 1.1; }
.trap small { font-family: var(--font-mono); font-size: 11px; color: var(--dim); }
.trap .cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(255,255,255,0.14); }
.trap.off { opacity: 0.4; }
.trap.laser { border-top: 3px solid var(--sab); }
.trap.pit { border-top: 3px solid var(--amber); }
.trap.shock { border-top: 3px solid var(--violet); }
.center { text-align: center; padding: 2px 14px; }
.center .round { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.16em; color: var(--dim); }
.center .clock { font-family: var(--font-display); font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 2px 14px rgba(0,0,0,0.7); }
.center .clock.warn { color: var(--amber); }
.center .clock.crit { color: var(--sab); }
.center .arena { font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text); text-shadow: 0 1px 8px rgba(0,0,0,0.8); }
.hint { align-self: center; font-family: var(--font-mono); font-size: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; text-align: center; max-width: 100%; }
#banner {
  position: absolute; left: 0; right: 0; top: 36%; text-align: center; pointer-events: none;
  opacity: 0; transform: scale(0.9); transition: opacity 0.15s, transform 0.15s;
}
#banner.show { opacity: 1; transform: scale(1); }
#banner .big { font-family: var(--font-display); font-size: clamp(44px, 9vw, 110px); line-height: 1; text-shadow: 0 4px 24px rgba(0,0,0,0.8); }
#banner .sub { font-size: 20px; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 8px; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }

/* Dialog screens */
.screen {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  background: rgba(6, 9, 24, 0.66); backdrop-filter: blur(5px); overflow-y: auto;
}
.dialog {
  width: min(960px, 100%); max-height: 100%; overflow-y: auto; margin: auto;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px; padding: 26px 30px;
}
.dialog h1 { font-family: var(--font-display); font-size: clamp(34px, 6vw, 62px); line-height: 1; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
.dialog h1 em { font-style: normal; color: var(--sab); }
.dialog h2 { font-family: var(--font-display); font-size: clamp(22px, 3.4vw, 34px); margin: 0; font-weight: 400; text-wrap: balance; }
.kicker { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); }
.lead { font-size: 19px; color: var(--dim); margin: 10px 0 0; max-width: 62ch; }
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 20px; }
.role-card { border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; min-width: 0; }
.role-card.r { border-top: 4px solid var(--runner); }
.role-card.s { border-top: 4px solid var(--sab); }
.role-card h3 { margin: 0 0 6px; font-family: var(--font-display); font-size: 20px; font-weight: 400; }
.role-card.r h3 { color: var(--runner); }
.role-card.s h3 { color: var(--sab); }
.role-card p { margin: 0 0 8px; color: var(--dim); font-size: 17px; line-height: 1.3; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 16px; margin-top: 8px; }
.keys dt { font-family: var(--font-mono); color: var(--text); }
.keys dd { margin: 0; color: var(--dim); }
kbd.k { font-family: var(--font-mono); background: var(--text); color: var(--ink); border-radius: 3px; padding: 0 6px; font-size: 14px; }
.actions { display: flex; align-items: center; gap: 14px; margin-top: 22px; flex-wrap: wrap; }
.btn {
  font-family: var(--font-display); font-size: 18px; letter-spacing: 0.04em; cursor: pointer;
  background: var(--amber); color: var(--ink); border: 0; border-radius: 4px; padding: 12px 22px;
  pointer-events: auto;
}
.btn:hover { filter: brightness(1.1); }
.btn:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.note { font-family: var(--font-mono); font-size: 13px; color: var(--dim); }
.rules { margin: 16px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 22px; font-size: 16px; color: var(--dim); }
.rules li b { color: var(--text); font-weight: 700; }
table.t { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 16px; }
.tw { overflow-x: auto; }
table.t th { text-align: left; font-family: var(--font-mono); font-weight: 400; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 7px 10px; border-bottom: 1px solid rgba(160,180,255,0.1); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t td.n, table.t th.n { text-align: right; }
table.t tr.total td { font-weight: 700; font-size: 18px; border-bottom: 0; }
.scorebox { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 16px; }
.sc { border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; }
.sc .who { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.14em; color: var(--dim); }
.sc .num { font-family: var(--font-display); font-size: 40px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.sc.lead-sc { border-color: var(--amber); }
.win { color: var(--runner); } .lose { color: var(--sab); }

    emissive: o.emissive || 0x000000, emissiveIntensity: o.ei == null ? 1 : o.ei,
    transparent: o.opacity != null, opacity: o.opacity == null ? 1 : o.opacity
  });
}

  return new THREE.MeshBasicMaterial({
    color: color, transparent: opacity != null || !!additive, opacity: opacity == null ? 1 : opacity,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: !additive, side: THREE.DoubleSide
  });
}

  obj.traverse(function (o) {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      var ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(function (m) { m.dispose(); });
    }
  });
}

function insideArena(x, z, margin) {

}

}

}

}

function tryTrap(type) {
  var def = TRAPS[type];
  if (Sb.uses[type] >= def.max) { flashHint(def.label + ': no charges left this round'); sfx.deny(); return; }
  if (Sb.cd[type] > 0) { sfx.deny(); return; }
  if (Sb.energy < def.cost) { flashHint('Not enough energy for ' + def.label); sfx.deny(); return; }
  if (Math.hypot(Sb.x - Rn.x, Sb.z - Rn.z) < SAFE_DIST) { flashHint('Too close to the Runner. Aim ahead of them.'); sfx.deny(); return; }
  Sb.energy -= def.cost; Sb.cd[type] = def.cd; Sb.uses[type]++;
  spawnTrap(type, Sb.x, Sb.z, Sb.orient);
  sfx.trap();
}
function spawnTrap(type, tx, tz, torient, tid) {
  var g = new THREE.Group();
  g.position.set(tx, 0, tz);
  var t = { id: tid || ++net.tid, type: type, x: tx, z: tz, orient: torient, age: 0, fired: false, g: g, parts: {} };
  if (type === 'laser') {
    var beamM = new THREE.Mesh(new THREE.BoxGeometry(LASER_LEN, 0.16, 0.16), basicMat(0xff4585, 0.3));
    beamM.position.y = 0.7;
    var coreM = new THREE.Mesh(new THREE.BoxGeometry(LASER_LEN, 0.05, 0.05), basicMat(0xffffff, 0.2));
    coreM.position.y = 0.7;
    var e1 = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 1.4, 10), stdMat(0x20263f, { emissive: 0xff4585, ei: 0.5 }));
    var e2 = e1.clone();
    e1.position.set(-LASER_LEN / 2, 0.7, 0); e2.position.set(LASER_LEN / 2, 0.7, 0);
    g.add(beamM, coreM, e1, e2);
    g.rotation.y = t.orient ? Math.PI / 2 : 0;
    t.parts.beam = beamM; t.parts.core = coreM;
  } else if (type === 'pit') {
    var disc = new THREE.Mesh(new THREE.CircleGeometry(PIT_R, 36), basicMat(0x000000, 0.0));
    disc.rotation.x = -Math.PI / 2; disc.position.y = 0.04;
    var rimM = new THREE.Mesh(new THREE.RingGeometry(PIT_R - 0.2, PIT_R + 0.1, 48), basicMat(0xffb13b, 0.9));
    rimM.rotation.x = -Math.PI / 2; rimM.position.y = 0.05;
    g.add(disc, rimM);
    t.parts.disc = disc; t.parts.rim = rimM;
  } else {
    var ringM = new THREE.Mesh(new THREE.RingGeometry(SHOCK_R - 0.2, SHOCK_R, 64), basicMat(0xb07cff, 0.8));
    ringM.rotation.x = -Math.PI / 2; ringM.position.y = 0.06;
    var fill = new THREE.Mesh(new THREE.CircleGeometry(SHOCK_R, 48), basicMat(0xb07cff, 0.1));
    fill.rotation.x = -Math.PI / 2; fill.position.y = 0.05;
    g.add(ringM, fill);
    t.parts.ring = ringM; t.parts.fill = fill;
  }
  world.add(g);
  A.traps.push(t);
  return t;
}
var WARN = { laser: 0.8, pit: 0.9, shock: 0.9 };
var LIFE = { laser: 3.5, pit: 4.0, shock: 0.6 };

function removeTrap(i) {
  var t = A.traps[i];
  world.remove(t.g); disposeTree(t.g);
  A.traps.splice(i, 1);
}

function updateTraps(dt, live) {
  if (orbPower.timeFreeze > 0 && state.phase === 'play') return;
  for (var i = A.traps.length - 1; i >= 0; i--) {
    var t = A.traps[i];
    t.age += dt;
    var warn = WARN[t.type];
    var active = t.age >= warn && t.age < warn + LIFE[t.type];
    var blink = Math.floor(t.age * 14) % 2 === 0;
    if (t.type === 'laser') {
      t.parts.beam.material.opacity = active ? 1 : (blink ? 0.45 : 0.12);
      t.parts.beam.scale.y = active ? 1.3 : 0.5; t.parts.beam.scale.z = active ? 1.3 : 0.5;
      t.parts.core.material.opacity = active ? 1 : 0;
      if (active && live) {
        var dx = Rn.x - t.x, dz = Rn.z - t.z;
        var along = t.orient ? dz : dx, perp = t.orient ? dx : dz;
        if (Math.abs(along) <= LASER_LEN / 2 + RAD && Math.abs(perp) <= 0.3 + RAD && Rn.y < 1.1) damageRunner('laser', t.x, t.z, t.orient ? Rn.x - t.x : 0, t.orient ? 0 : Rn.z - t.z);
      }
    } else if (t.type === 'pit') {
      t.parts.disc.material.opacity = active ? 0.96 : 0;
      t.parts.rim.material.opacity = active ? 0.95 : (blink ? 0.9 : 0.25);
      t.parts.rim.material.color.setHex(active ? 0xff4a3a : 0xffb13b);
      if (active && live && Rn.grounded && Rn.y < 0.05 && Rn.fall <= 0 && Rn.invuln <= 0 && Math.hypot(Rn.x - t.x, Rn.z - t.z) < PIT_R - 0.15) fallInPit(t);
    } else {
      if (t.age < warn) {
        t.parts.ring.material.opacity = blink ? 0.9 : 0.4;
        t.parts.fill.material.opacity = 0.08 + 0.1 * Math.sin(t.age * 14);
      } else {
        if (!t.fired) {
          t.fired = true;
          sfx.fire(); camShake = Math.max(camShake, 0.5);
          burst(t.x, 0.5, t.z, 0xb07cff, 26, 9);
          if (live && Rn.invuln <= 0 && Rn.fall <= 0) {
            var d = Math.hypot(Rn.x - t.x, Rn.z - t.z);
            if (d < SHOCK_R) {
              var nx = d > 0.01 ? (Rn.x - t.x) / d : 1, nz = d > 0.01 ? (Rn.z - t.z) / d : 0;
              Rn.vx = nx * 17; Rn.vz = nz * 17; Rn.vy = 5; Rn.grounded = false; Rn.stun = 0.9;
              rd.sabPts += SCORE.shock; rd.stats.stuns++;
              burst(Rn.x, 1, Rn.z, 0xb07cff, 14, 6);
              sfx.hit();
            }
          }
        }
        var f = (t.age - warn) / LIFE.shock;
        t.parts.ring.scale.set(1 + f * 0.35, 1 + f * 0.35, 1);
        t.parts.ring.material.opacity = clamp(1 - f, 0, 1);
        t.parts.fill.material.opacity = clamp(0.5 * (1 - f), 0, 1);
      }
    }
    if (t.age >= warn + LIFE[t.type]) removeTrap(i);
  }
}

/* ------------------------------------------------------------------ */
/* Runner damage                                                       */
/* ------------------------------------------------------------------ */
function damageRunner(kind, fx, fz, dirx, dirz) {
  if (orbPower.shield > 0 || orbPower.invisibility > 0 || Rn.invuln > 0 || Rn.fall > 0 || Rn.dead || state.phase !== 'play') return;
  Rn.hearts--; Rn.invuln = 1.8; Rn.stun = 0.3;
  rd.stats.hits++;
  if (kind === 'laser') rd.sabPts += SCORE.laser;

.intro-robot{filter:drop-shadow(0 12px 24px rgba(0,0,0,.8));}
.intro-robot:before{background:linear-gradient(145deg,#82766e,#302b29 62%,#11100f)!important;border-color:#cf6247!important;box-shadow:0 0 22px rgba(221,83,55,.28)!important;}
.intro-robot:after{background:linear-gradient(110deg,#211b19,#62534b 48%,#211917)!important;border-color:#685249!important;}
.intro-robot i,.intro-robot b{background:#ff6548!important;box-shadow:0 0 13px #ff6548!important;}
.intro-robot em{background:#e6533c!important;box-shadow:0 0 20px rgba(230,83,60,.72)!important;}
.intro-copy{z-index:5!important;}
.intro-beat{animation:story-beat 35s both!important;}
.intro-beat.beat2{animation-delay:7s!important;}.intro-beat.beat3{animation-delay:14s!important;}.intro-beat.beat4{animation-delay:21s!important;}.intro-beat.beat5{animation-delay:28s!important;}
.intro-beat .kicker{color:#f07859!important;letter-spacing:.22em!important;text-shadow:0 2px 12px #000;}
.intro-beat h2{max-width:12ch;letter-spacing:.015em!important;text-shadow:0 4px 30px rgba(0,0,0,.9)!important;}
.intro-beat p{max-width:39ch!important;color:#f0ded3!important;text-shadow:0 3px 18px #000!important;}
.intro-progress i{animation:intro-progress 35s linear forwards!important;}
.intro-mark{color:rgba(244,214,198,.72)!important;}
@keyframes story-beat{0%,1%{opacity:0;transform:translateY(14px)}3%,17%{opacity:1;transform:translateY(0)}20%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes intro-progress{to{width:100%}}
@keyframes intro-camera{0%{transform:scale(1.015);background-position:50% 50%}100%{transform:scale(1.09);background-position:53% 58%}}
@media(prefers-reduced-motion:reduce){.intro-sky,.intro-beat,.intro-progress i{animation:none!important}.intro-beat{opacity:0!important}.intro-beat.beat5{opacity:1!important}}
.intro-sound{position:absolute;z-index:8;left:clamp(20px,4vw,58px);top:clamp(18px,4vh,42px);padding:11px 15px;font:600 12px var(--font-mono);letter-spacing:.12em}
.intro-sound[aria-pressed="true"]{background:rgba(67,39,29,.88)!important;color:#f6e8df!important;border-color:rgba(210,126,88,.45)!important;box-shadow:none!important}
</style>
</body></html>
